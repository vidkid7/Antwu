# Replace the certificate paths after obtaining the antwu.org.np certificate
# (for example with certbot) before enabling the TLS server block.
server {
  listen 80;
  listen [::]:80;
  server_name antwu.org.np www.antwu.org.np;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name antwu.org.np www.antwu.org.np;

  ssl_certificate /etc/letsencrypt/live/antwu.org.np/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/antwu.org.np/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Membership permits up to five identity files plus photo and receipt.
  client_max_body_size 36m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /_next/static/ {
    alias /var/www/antwu/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
